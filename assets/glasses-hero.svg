<svg viewBox="0 0 480 360" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <!-- Hero Glasses Illustration -->
  <defs>
    <linearGradient id="glassGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0EA5E9;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#0284C7;stop-opacity:0.9" />
    </linearGradient>
    <linearGradient id="frameGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#162538;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0E1E2E;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Left Lens -->
  <ellipse cx="140" cy="150" rx="70" ry="85" fill="url(#glassGradient)" opacity="0.9"/>
  <ellipse cx="140" cy="150" rx="68" ry="83" fill="none" stroke="#0EA5E9" stroke-width="2" opacity="0.6"/>
  
  <!-- Right Lens -->
  <ellipse cx="340" cy="150" rx="70" ry="85" fill="url(#glassGradient)" opacity="0.9"/>
  <ellipse cx="340" cy="150" rx="68" ry="83" fill="none" stroke="#0EA5E9" stroke-width="2" opacity="0.6"/>
  
  <!-- Bridge -->
  <rect x="210" y="140" width="60" height="20" fill="url(#frameGradient)" rx="10"/>
  
  <!-- Left Frame -->
  <path d="M 70 100 Q 80 80 140 70 Q 200 65 210 140" fill="none" stroke="url(#frameGradient)" stroke-width="8" stroke-linecap="round"/>
  <path d="M 70 200 Q 80 220 140 230 Q 200 235 210 160" fill="none" stroke="url(#frameGradient)" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Right Frame -->
  <path d="M 270 140 Q 280 65 340 70 Q 400 80 410 100" fill="none" stroke="url(#frameGradient)" stroke-width="8" stroke-linecap="round"/>
  <path d="M 270 160 Q 280 235 340 230 Q 400 220 410 200" fill="none" stroke="url(#frameGradient)" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Left Temple (arm) -->
  <line x1="70" y1="100" x2="40" y2="120" stroke="url(#frameGradient)" stroke-width="7" stroke-linecap="round"/>
  <line x1="70" y1="200" x2="40" y2="220" stroke="url(#frameGradient)" stroke-width="7" stroke-linecap="round"/>
  
  <!-- Right Temple (arm) -->
  <line x1="410" y1="100" x2="440" y2="120" stroke="url(#frameGradient)" stroke-width="7" stroke-linecap="round"/>
  <line x1="410" y1="200" x2="440" y2="220" stroke="url(#frameGradient)" stroke-width="7" stroke-linecap="round"/>
  
  <!-- Blue Light Glow Effect -->
  <circle cx="140" cy="150" r="75" fill="none" stroke="#0EA5E9" stroke-width="1" opacity="0.3"/>
  <circle cx="340" cy="150" r="75" fill="none" stroke="#0EA5E9" stroke-width="1" opacity="0.3"/>
  
  <!-- Premium shine effect -->
  <ellipse cx="120" cy="130" rx="15" ry="25" fill="white" opacity="0.15"/>
  <ellipse cx="320" cy="130" rx="15" ry="25" fill="white" opacity="0.15"/>
</svg>