<svg viewBox="0 0 450 350" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <!-- Detail Shot - Lens Close-up -->
  <defs>
    <radialGradient id="lensDetail" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#60D5FF;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#0284C7;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Lens macro view -->
  <circle cx="225" cy="160" r="130" fill="url(#lensDetail)" opacity="0.95"/>
  
  <!-- Lens border -->
  <circle cx="225" cy="160" r="130" fill="none" stroke="#0EA5E9" stroke-width="3"/>
  <circle cx="225" cy="160" r="125" fill="none" stroke="rgba(14,165,233,0.2)" stroke-width="1"/>
  
  <!-- Blue light blocking visualization -->
  <circle cx="225" cy="160" r="100" fill="none" stroke="#FF6B6B" stroke-width="15" stroke-dasharray="12,8" opacity="0.25"/>
  
  <!-- Coating layers -->
  <circle cx="225" cy="160" r="120" fill="none" stroke="rgba(212,168,75,0.3)" stroke-width="1" stroke-dasharray="4,4" opacity="0.6"/>
  
  <!-- Premium shine -->
  <ellipse cx="180" cy="115" rx="35" ry="50" fill="white" opacity="0.2"/>
  <ellipse cx="190" cy="125" rx="20" ry="30" fill="white" opacity="0.35"/>
  
  <!-- Label -->
  <rect x="60" y="280" width="330" height="45" fill="rgba(14,165,233,0.08)" rx="8"/>
  <text x="225" y="305" font-family="Arial" font-size="14" text-anchor="middle" fill="#0EA5E9" font-weight="bold">Anti-Glare Coating | Blue Light Protection</text>
</svg>