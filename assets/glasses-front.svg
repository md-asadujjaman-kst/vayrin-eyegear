<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <!-- Front View Glasses -->
  <defs>
    <linearGradient id="lens1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0EA5E9;stop-opacity:0.85" />
      <stop offset="100%" style="stop-color:#0284C7;stop-opacity:0.95" />
    </linearGradient>
  </defs>
  
  <!-- Left Lens -->
  <circle cx="120" cy="150" r="65" fill="url(#lens1)"/>
  <circle cx="120" cy="150" r="63" fill="none" stroke="#0EA5E9" stroke-width="2"/>
  
  <!-- Right Lens -->
  <circle cx="280" cy="150" r="65" fill="url(#lens1)"/>
  <circle cx="280" cy="150" r="63" fill="none" stroke="#0EA5E9" stroke-width="2"/>
  
  <!-- Bridge -->
  <rect x="185" y="140" width="30" height="20" fill="#162538" rx="4"/>
  
  <!-- Left Upper Frame -->
  <path d="M 55 110 Q 70 85 120 80 Q 170 78 185 140" fill="none" stroke="#1E3450" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Left Lower Frame -->
  <path d="M 55 190 Q 70 215 120 220 Q 170 222 185 160" fill="none" stroke="#1E3450" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Right Upper Frame -->
  <path d="M 215 140 Q 230 78 280 80 Q 330 85 345 110" fill="none" stroke="#1E3450" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Right Lower Frame -->
  <path d="M 215 160 Q 230 222 280 220 Q 330 215 345 190" fill="none" stroke="#1E3450" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Shine reflection -->
  <ellipse cx="105" cy="130" rx="12" ry="20" fill="white" opacity="0.18"/>
  <ellipse cx="265" cy="130" rx="12" ry="20" fill="white" opacity="0.18"/>
</svg>